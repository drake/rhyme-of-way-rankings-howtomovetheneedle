<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Georgia, "Iowan Old Style", serif;
    background: #f3ead8;
    color: #16130e;
    position: relative;
  }
  .wash {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 420px at 78% 18%, rgba(155,44,44,.12), transparent 60%),
      radial-gradient(700px 380px at 8% 90%, rgba(31,107,74,.10), transparent 55%),
      linear-gradient(180deg, #f7f1e4 0%, #efe4cf 100%);
  }
  .dots {
    position: absolute; inset: 40px 40px 90px 520px;
    opacity: .55;
  }
  .frame {
    position: absolute; inset: 28px;
    border: 1px solid rgba(22,19,14,.14);
    border-radius: 18px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.4);
  }
  .copy {
    position: absolute; left: 64px; top: 72px; width: 520px;
  }
  .kicker {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 15px; font-weight: 700; letter-spacing: .18em;
    text-transform: uppercase; color: #9b2c2c; margin: 0 0 18px;
  }
  h1 {
    margin: 0; font-size: 72px; line-height: .92; letter-spacing: -.04em;
    font-weight: 700;
  }
  .lede {
    margin: 22px 0 0; font-size: 24px; line-height: 1.35; color: #3a352e;
    max-width: 28ch;
  }
  .signs {
    position: absolute; right: 88px; top: 96px; width: 460px; height: 340px;
  }
  .pole {
    position: absolute; left: 50%; top: 18px; width: 14px; height: 300px;
    margin-left: -7px; background: linear-gradient(90deg, #c9c2b4, #ece7db 40%, #b7b0a2);
    border-radius: 2px;
  }
  .blade {
    position: absolute; left: 50%;
    transform: translateX(-50%);
    min-width: 280px; text-align: center;
    background: #0e5a3a; color: #fff;
    border: 5px solid #f7f3ea;
    border-radius: 8px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    font-size: 28px; padding: 12px 28px;
    box-shadow: 0 14px 28px rgba(22,19,14,.22);
  }
  .a { top: 70px; transform: translateX(-54%) rotate(-7deg); }
  .b { top: 168px; transform: translateX(-46%) rotate(6deg); }
  .bar {
    position: absolute; left: 64px; right: 64px; bottom: 48px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: ui-sans-serif, system-ui, sans-serif;
    border-top: 1px solid rgba(22,19,14,.14); padding-top: 16px;
  }
  .stat { font-size: 18px; color: #3a352e; }
  .stat strong { color: #16130e; font-size: 20px; }
  .brand { font-size: 16px; color: #6b645a; letter-spacing: .02em; }
</style>
</head>
